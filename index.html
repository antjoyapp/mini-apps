<title>Mini-Apps</title>
<style>
:root{--bg:#f6f6f4;--fg:#1c1c1a;--muted:#6b6b66;--card:#fff;--line:#e3e3de}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ececea;--muted:#9a9a94;--card:#1f1f1d;--line:#2e2e2b}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:32px 16px}
h1{font-size:1.5rem;margin:0 0 20px}
a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;color:inherit;text-decoration:none}
a span{display:block;color:var(--muted);font-size:.9rem}
</style>
</head>
